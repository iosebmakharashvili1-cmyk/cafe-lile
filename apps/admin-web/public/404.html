<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>გვერდი ვერ მოიძებნა — კაფე ლილეს ადმინი</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; overflow-x: hidden; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100%;
        padding: 24px;
        background: #fffdf7;
        color: #211c12;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        text-align: center;
      }
      .badge {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: #f5b700;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Fraunces", Georgia, serif;
        font-weight: 700;
        font-size: 22px;
        margin: 0 auto 24px;
      }
      h1 {
        font-family: "Fraunces", Georgia, serif;
        font-weight: 700;
        font-size: 28px;
        margin: 0 0 8px;
      }
      p {
        font-size: 15px;
        color: #6b6250;
        margin: 0 0 28px;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        background: #f5b700;
        color: #211c12;
        text-decoration: none;
        font-weight: 700;
        font-size: 14.5px;
        padding: 13px 26px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="badge">CL</div>
      <h1>გვერდი ვერ მოიძებნა</h1>
      <p>ეს ადმინის გვერდი არ არსებობს.</p>
      <a href="/">დაბრუნება მთავარ გვერდზე</a>
    </div>
  </body>
</html>
